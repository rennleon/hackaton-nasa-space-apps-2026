# Variable cards. One card per Giovanni variable. Everything gate 2 (fitness)
# needs lives here, so a variable can be judged before any download.
#
# units: display = native * scale + offset  (slopes and anomalies use scale only)
# artifacts.action:
#   end_window_before -> the default analysis window ends the month before `start`
#   flag              -> keep the data, show a warning chip
# themes: theme id -> role (target | driver | response | cross_check)
# words: kid sentence parts -> "Yes, {subject} {verb} {up} in {region}." (simple view)
# kid_units: whole-number 'then vs now' in the simple view = display value * scale, then label
# reference_trend_per_decade (+ reference_source): a published, typical trend size used by
#   stage-1 detectability (minimum detectable trend <= expected size). Leave null if unknown.
# Drift rule is decided PER VARIABLE: end_window_before only for variables sensitive to the
#   overpass time (AIRS surface humidity/temperature, clouds); others keep the record + a flag chip.
# power_param: NASA POWER parameter (live source for any region); giovanni_id may then be null.
#
# TODO: AIRS surface specific humidity (day/night) -> confirm the Giovanni ID first.

- id: airs_rh_surf_day
  giovanni_id: AIRS3STM_7_0_RelHumSurf_A
  name: { simple: Afternoon humidity, scientific: "Surface relative humidity (daytime, AIRS ascending)" }
  definition:
    simple: How close the air near the ground is to being full of water vapour, measured from space at about 1:30 in the afternoon.
    scientific: AIRS/Aqua Level-3 monthly surface relative humidity, ascending (≈13:30 local) overpass, 1° grid.
  source: { instrument: AIRS, platform: Aqua, type: observed, instrument_id: airs }
  units: { native: "%", display: "%RH", simple: humidity points, scale: 1.0, offset: 0.0, decimals: 2 }
  grid_deg: 1.0
  record_start: 2002-09
  artifacts:
    - kind: orbit_drift
      start: 2022-01
      action: end_window_before
      note:
        simple: After 2021 the satellite flew over later in the day. We leave those years out.
        scientific: Aqua ceased orbit maintenance in Jan 2022; the drifting overpass time biases the diurnal sampling.
  cross_check: power_rh2m
  words: { subject: "afternoons", verb: are, up: "getting more humid", down: "getting less humid" }
  kid_units: { scale: 1, label: "on the humidity scale (0 to 100)" }
  themes: { water: response }

