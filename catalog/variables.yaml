      note: { simple: "This is a computer model. Its weather inputs changed in 2001. Small jumps can show up.", scientific: "GLDAS-2.1 forcing change: AGRMET radiation added from 1 Mar 2001, so the forcing is not homogeneous over 2000 to now; do not splice with GLDAS-2.0. Source: Rui and Beaudoing, README for NASA GLDAS Version 2 Data Products, GES DISC, rev. 13 Aug 2025, Section 1.2.3 (pp. 8-9) and Section 1.6 (p. 15), https://hydro1.gesdisc.eosdis.nasa.gov/data/GLDAS/GLDAS_NOAH025_M.2.1/doc/README_GLDAS2.pdf.", simple_es: "Esto es un modelo de computadora. Sus datos de entrada del tiempo cambiaron en 2001. Pueden verse saltos pequeños.", scientific_es: "Cambio del forzamiento de GLDAS-2.1: la radiación AGRMET se añadió desde el 1 de marzo de 2001, así que el forzamiento no es homogéneo entre 2000 y hoy; no se debe empalmar con GLDAS-2.0. Fuente: Rui y Beaudoing, README for NASA GLDAS Version 2 Data Products, GES DISC, rev. 13 ago 2025, Sección 1.2.3 (pp. 8-9) y Sección 1.6 (p. 15), https://hydro1.gesdisc.eosdis.nasa.gov/data/GLDAS/GLDAS_NOAH025_M.2.1/doc/README_GLDAS2.pdf." }
    - kind: input_change
      start: 2008-01
      action: flag
      note: { simple: "The model adjusted one of its inputs in a new way from 2008.", scientific: "From 2008 the AGRMET radiation input is bias-corrected with scale factors that differ from the 2002-2007 overlap (month not stated in the README; January is used here). Source: Rui and Beaudoing, GLDAS Version 2 README, GES DISC, rev. 13 Aug 2025, Section 1.2.3 (pp. 8-9).", simple_es: "El modelo ajustó uno de sus datos de entrada de otra forma desde 2008.", scientific_es: "Desde 2008 la radiación AGRMET se corrige el sesgo con factores de escala distintos de los del solape 2002-2007 (el README no da el mes; aquí se usa enero). Fuente: Rui y Beaudoing, README de GLDAS versión 2, GES DISC, rev. 13 ago 2025, Sección 1.2.3 (pp. 8-9)." }
    - kind: input_change
      start: 2012-01
      action: flag
      note: { simple: "One of the model's inputs seems to shift after 2011. Small jumps can show up.", scientific: "The README states that the AGRMET scaling cannot correct an apparent shift of unknown origin in the AGRMET climatology after 2011 (month not stated; January 2012 is used here). Source: Rui and Beaudoing, GLDAS Version 2 README, GES DISC, rev. 13 Aug 2025, Section 1.5.3 (pp. 14-15).", simple_es: "Uno de los datos de entrada del modelo parece cambiar después de 2011. Pueden verse saltos pequeños.", scientific_es: "El README indica que el escalado de AGRMET no puede corregir un cambio aparente de origen desconocido en la climatología de AGRMET después de 2011 (no da el mes; aquí se usa enero de 2012). Fuente: Rui y Beaudoing, README de GLDAS versión 2, GES DISC, rev. 13 ago 2025, Sección 1.5.3 (pp. 14-15)." }
    - kind: input_change
