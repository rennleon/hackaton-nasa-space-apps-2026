- id: gpm_precip
  giovanni_id: GPM_3IMERGM_07_precipitation
  name: { simple: Rainfall, scientific: Precipitation rate (GPM IMERG), simple_es: "Lluvia", scientific_es: "Tasa de precipitación (GPM IMERG)" }
  definition:
    simple: How much rain and snow falls, measured by satellites.
    scientific: GPM IMERG final monthly precipitation (V07), 0.1° grid; multi-satellite, gauge-adjusted.
    simple_es: "Cuánta lluvia y nieve cae, medida por satélites."
    scientific_es: "Precipitación mensual final de GPM IMERG (V07), rejilla de 0.1°; multisatélite, ajustada con pluviómetros."
  source: { instrument: GPM IMERG, platform: GPM, type: observed, instrument_id: gpm_imerg }
  kind: rainfall  # which published assessments speak about it (expectations.yaml)
  units: { native: mm/hr, display: mm/day, simple: mm of rain per day, scale: 24.0, offset: 0.0, decimals: 2, simple_es: "mm de lluvia por día" }
  grid_deg: 0.1
  # units checked: GPM_3IMERGM_07_precipitation is mm/hr (tracker log); display mm/day = x 24
  # The V07 record starts Jan 1998, but Jan 1998 to May 2000 is lower quality (GridSat-B1 IR instead of CPC IR)
  # and the team recommends avoiding it (IMERG V07 Release Notes, Appendix 4, p. 23): start at 2000-06.
  record_start: 2000-06
  floor: 0.0
  artifacts:
    - kind: input_change
      start: 2014-06
      action: flag
      note:
        simple: This rain record joins two satellite eras. Small jumps are possible around 2014.
        scientific: "IMERG V07 merges the TRMM era (to 2015) and the GPM era (from 2014) in one record. It is a high-resolution product, not a climate data record, and its release notes say studies of trends should check the series for artifacts from an evolving satellite constellation. The CORRA and GPROF inputs jump at the TRMM-to-GPM shift (June 2014), and also at the TRMM orbit boost (Aug 2001) and the GPM orbit boost (Nov 2023). Means are described as consistent, but extremes and rain-detection frequency differ between the two calibrations. Sources: Huffman, G.J. et al., IMERG V07 Release Notes, 20 Nov 2024, 'Known issues', pp. 3-4, https://gpm.nasa.gov/sites/default/files/2024-12/IMERG_V07_ReleaseNotes_241126.pdf; NASA GPM IMERG page, Data FAQ, https://gpm.nasa.gov/data/imerg."
        simple_es: "Este registro de lluvia une dos eras de satélites. Pueden verse saltos pequeños hacia 2014."
        scientific_es: "IMERG V07 une en un solo registro la era TRMM (hasta 2015) y la era GPM (desde 2014). Es un producto de alta resolución, no un registro de datos climáticos, y sus notas de versión piden revisar artefactos de la constelación de satélites al estudiar tendencias. Las entradas CORRA y GPROF dan un salto en el cambio de TRMM a GPM (junio de 2014), y también en el impulso de órbita de TRMM (agosto de 2001) y el de GPM (noviembre de 2023). Las medias se describen como consistentes, pero los extremos y la frecuencia de detección de lluvia difieren entre las dos calibraciones. Fuentes: Huffman, G.J. et al., IMERG V07 Release Notes, 20 nov 2024, 'Known issues', pp. 3-4, https://gpm.nasa.gov/sites/default/files/2024-12/IMERG_V07_ReleaseNotes_241126.pdf; NASA GPM, página de IMERG, preguntas frecuentes, https://gpm.nasa.gov/data/imerg."
  cross_check: power_precip
  words: { subject: "it", verb: is, up: "getting wetter", down: "getting drier" }
  words_es: { subject: "la lluvia", up: "está aumentando", down: "está disminuyendo", changing: "está cambiando" }
  kid_units: { scale: 1, label: "mm of rain a day", label_es: "mm de lluvia al día" }
  themes: { water: target, rain: target }

