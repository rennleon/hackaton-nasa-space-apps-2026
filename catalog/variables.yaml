# --- OMI on Aura (Giovanni cloud, DAILY grids; Air theme) ---
# Daily values are averaged to months by the source. A month counts only with at least
# `min_valid_days` valid days: 10 is declared here BEFORE any result is seen.
# OMI row anomaly (from 25 June 2007): flagged, not cut. Sources: Torres et al. 2018 and the OMNO2 README
# (see the artifact note and docs/sources-checked.md section 3a).
- id: omi_aod
  giovanni_id: OMAERUVd_003_FinalAerosolOpticalDepth500
  name: { simple: Haze in the air (OMI satellite), scientific: Aerosol optical depth at 500 nm (OMI OMAERUV), simple_es: "Bruma en el aire (satélite OMI)", scientific_es: "Profundidad óptica de aerosoles a 500 nm (OMI OMAERUV)" }
  definition:
    simple: How much dust, smoke and pollution blocks sunlight. 0 is perfectly clear; 1 is very hazy.
    scientific: OMI/Aura near-UV aerosol optical depth at 500 nm (OMAERUVd V003), daily 1° grid, averaged to months.
    simple_es: "Cuánto polvo, humo y contaminación tapan la luz del sol. 0 es aire muy claro; 1 es muy brumoso."
    scientific_es: "Profundidad óptica de aerosoles a 500 nm en el ultravioleta cercano de OMI/Aura (OMAERUVd V003), rejilla diaria de 1°, promediada a meses."
  source: { instrument: OMI, platform: Aura, type: observed, instrument_id: omi }
  kind: haze  # which published assessments speak about it (expectations.yaml)
  units: { native: "1", display: AOD, simple: points on the haze scale, scale: 1.0, offset: 0.0, decimals: 3, simple_es: "puntos en la escala de bruma" }
  cadence: daily
  min_valid_days: 10  # declared before results
  grid_deg: 1.0  # OMAERUVd is 1.0 x 1.0 degree (CMR collection title); the brief said 0.25, that is OMNO2d
  record_start: 2004-10  # CMR collection start 2004-10-01
  artifacts:
    - kind: row_anomaly
      start: 2007-06
      action: flag
      note: &omi_row_anomaly
        simple: Since 2007, part of this satellite's view has been blocked. So some days have no data for your place.
        scientific: "OMI row anomaly: a physical obstruction in the sensor view first appeared on 25 June 2007 (cross-track positions 53 and 54) and spread from 11 May 2008; about half of the 60 viewing positions are now affected and affected pixels are flagged. OMI still samples a place about every other day, so the authors expect no loss of statistical weight in averages, but retrievals that use only part of the swath can behave differently, and the aerosol record needed algorithm fixes. We keep the data and count valid days per month (min_valid_days). Sources: Torres, O. et al. 2018, Atmos. Meas. Tech. 11, 2701-2715, doi:10.5194/amt-11-2701-2018, Sections 1-2; OMI Algorithm Team, OMNO2 README (v4.0), Sections 2.1 and 2.4 (it describes version 4.0; Giovanni serves version 003, whose handling was not checked)."
        simple_es: "Desde 2007, una parte de la vista de este satélite está tapada. Por eso algunos días no hay datos de tu lugar."
        scientific_es: "Anomalía de filas de OMI: una obstrucción física en la vista del sensor apareció el 25 de junio de 2007 (posiciones transversales 53 y 54) y se extendió desde el 11 de mayo de 2008; hoy afecta a cerca de la mitad de las 60 posiciones de observación y los píxeles afectados quedan marcados. OMI aún muestrea un lugar casi cada dos días, así que los autores no esperan perder peso estadístico en los promedios, pero las recuperaciones que usan solo parte de la franja pueden comportarse distinto, y el registro de aerosoles necesitó correcciones del algoritmo. Conservamos los datos y contamos los días válidos por mes (min_valid_days). Fuentes: Torres, O. et al. 2018, Atmos. Meas. Tech. 11, 2701-2715, doi:10.5194/amt-11-2701-2018, Secciones 1-2; OMI Algorithm Team, README de OMNO2 (v4.0), Secciones 2.1 y 2.4 (describe la versión 4.0; Giovanni sirve la versión 003, cuyo tratamiento no se comprobó)."
  cross_check: power_aod
  words: { subject: "the air", verb: is, up: "getting hazier", down: "getting clearer" }
  words_es: { subject: "el aire", up: "se llena de más bruma", down: "se vuelve más despejado", changing: "está cambiando" }
  kid_units: { scale: 100, label: "on the haze scale", label_es: "en la escala de bruma" }
  themes: { air: target, smoke_haze: target }

