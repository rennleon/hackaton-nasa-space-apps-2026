        simple_es: "Después de 2008 el modelo dejó de actualizar la contaminación por combustible. Tampoco incluye erupciones después de 2010."
        scientific_es: "MERRA-2 mantiene las emisiones antropogénicas de SO₂ (EDGAR v4.2) en sus valores de 2008 y las de SO₄ (AeroCom HCA0 v1) en los de 2006; no incluye erupciones volcánicas después de 2010 (solo un ciclo repetido de desgasificación). Solo se asimila la AOD total a 550 nm, así que los cambios posteriores del sulfato reflejan la meteorología y los incrementos de AOD, no cambios de emisiones. Randles et al. 2017, J. Climate 30, 6823-6850, doi:10.1175/JCLI-D-16-0609.1, tabla 1 («For time-varying emissions, the final year of emissions is persisted»)."
  cross_check: null
