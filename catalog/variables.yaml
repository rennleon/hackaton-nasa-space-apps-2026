# --- OMI on Aura (Giovanni cloud, DAILY grids; Air theme) ---
# Daily values are averaged to months by the source. A month counts only with at least
# `min_valid_days` valid days: 10 is declared here BEFORE any result is seen.
# TODO cite: OMI "row anomaly" (from 2007) reduces valid pixels; no artifact note until a source is cited.
- id: omi_aod
  giovanni_id: OMAERUVd_003_FinalAerosolOpticalDepth500
  name: { simple: Haze in the air (OMI satellite), scientific: Aerosol optical depth at 500 nm (OMI OMAERUV) }
  definition:
    simple: How much dust, smoke and pollution blocks sunlight. 0 is perfectly clear; 1 is very hazy.
    scientific: OMI/Aura near-UV aerosol optical depth at 500 nm (OMAERUVd V003), daily 1° grid, averaged to months.
  source: { instrument: OMI, platform: Aura, type: observed, instrument_id: omi }
  units: { native: "1", display: AOD, simple: points on the haze scale, scale: 1.0, offset: 0.0, decimals: 3 }
  cadence: daily
  min_valid_days: 10  # declared before results
  grid_deg: 1.0  # OMAERUVd is 1.0 x 1.0 degree (CMR collection title); the brief said 0.25, that is OMNO2d
  record_start: 2004-10  # CMR collection start 2004-10-01
  artifacts: []
  cross_check: power_aod
  words: { subject: "the air", verb: is, up: "getting hazier", down: "getting clearer" }
  kid_units: { scale: 100, label: "on a haze scale of 0 to 100" }
  themes: { air: target }

- id: omi_no2
  giovanni_id: OMNO2d_003_ColumnAmountNO2TropCloudScreened
  name: { simple: Pollution gas NO₂ (OMI satellite), scientific: "Tropospheric NO₂ column, cloud-screened (OMI OMNO2d)" }
  definition:
    simple: A gas made when engines and factories burn fuel. Satellites count how much of it floats above a place.
    scientific: OMI/Aura tropospheric NO₂ vertical column, cloud-screened (OMNO2d V003), daily 0.25° grid, averaged to months.
  source: { instrument: OMI, platform: Aura, type: observed, instrument_id: omi }
  units: { native: molecules/cm², display: 10¹⁵ molecules/cm², simple: units of pollution gas, scale: 1.0e-15, offset: 0.0, decimals: 2 }
  cadence: daily
  min_valid_days: 10  # declared before results
  grid_deg: 0.25
  record_start: 2004-10  # CMR collection start 2004-10-01
  floor: 0.0
  artifacts: []
  cross_check: null  # no second NO₂ source in the catalog
  words: { subject: "the pollution gas NO₂", verb: is, up: "going up", down: "going down" }
  # display is in 10^15 units; x10 gives whole numbers that can show a change (about 10 in a clean area, 50+ in a city)
  kid_units: { scale: 10, label: "on a pollution-gas scale" }
  themes: { air: target }

