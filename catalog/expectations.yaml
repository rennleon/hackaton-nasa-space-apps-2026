    simple_es: "Un gas contaminante de quemar combustible subió mucho en India. En muchos lugares baja desde 2011."
    scientific: "Satellite tropospheric NO2 over Southern Asia grew rapidly, about 50 percent during 2005-2015, driven by hotspots in India's power sector; many parts of India show a trend reversal since 2011 (Georgoulias et al. 2019, as cited by AR6). Independent NASA-led OMI study: NO2 over India rose by more than 50 percent from 2005 to 2015 (Krotkov et al. 2016, abstract). Measured by OMI, the same instrument we use."
