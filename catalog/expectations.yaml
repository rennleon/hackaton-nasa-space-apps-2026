    scientific: "Satellite (MODIS, MISR) and AERONET retrievals of aerosol optical depth show continuing increases over southern Asia, with similar trends from UV-based retrievals from OMI on Aura. The trend maps in Figure 2.9c cover 2000-2019. The assessed summary says AOD rose over South Asia and East Africa since 2000 (high confidence)."
