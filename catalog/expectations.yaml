# Published expectations: what scientists have already assessed for the places we show.
# Written by the sources-research unit on 2026-11-15. Every entry was checked against the opened final
# IPCC AR6 WGI chapter PDFs on ipcc.ch (not drafts), with table and page recorded in `source`.
# Page numbers are the printed report page numbers (pp. of the Cambridge University Press volume).
#
# Fields (as requested): ar6_region, variable_kind, direction, confidence, period, statement{simple,scientific},
# source, checked_by, opened_at. Extra optional fields: ar6_region_name, place (which of our places this covers),
# metric (what exactly is assessed, e.g. hot_extremes, heavy_precipitation, mean_annual).
#
# direction: up | down | either | unclear.   unclear = the source says data are limited or evidence is low
# confidence; the Simple text then says scientists don't have enough data yet. Never read unclear as proof that nothing is happening.
# confidence is worded as the source words it (IPCC calibrated language or the chapter's own phrasing).
#
# AR6 reference region of each place (point-in-polygon on IPCC-WGI-reference-regions-v4.geojson from
# github.com/IPCC-WG1/Atlas, Iturbide et al. 2020, https://doi.org/10.5194/essd-12-2959-2020):
#   Cajamarca highlands box (W-79 S-8 E-77 N-5): NWS (all four corners and the centre)
#   Wisconsin box: split by the CNA/ENA boundary at about 90 W; west part CNA, east part ENA (entries for both)
#   Delhi (28.61, 77.21): SAS    Manaus (-3.10, -60.02): NSA    Tamanrasset (22.79, 5.52): SAH
#
# Not found / not used: no AR6 regional assessment of relative humidity or soil moisture by region beyond the
# drought rows above; the GLOBAL_LAND humidity entry is a global pattern only. Variable kinds with no entry for a
# region simply mean AR6 gives nothing citable there.
#
# R5 note: simple texts follow the CLAUDE.md plain-language rules (short sentences, no banned words, no
# decimals or percentages). The mapping used for the words: IPCC high confidence or very likely -> "quite sure";
# likely or medium confidence -> "think so"; low confidence or limited evidence -> "not sure / not enough data".

