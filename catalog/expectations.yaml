  confidence: "Very likely decrease in relative humidity over much of the global land area since 2000; trends show distinct spatial patterns"
  confidence_es: "Disminución muy probable de la humedad relativa en gran parte de la tierra del mundo desde 2000; las tendencias muestran patrones espaciales distintos"
  period: "since 2000 (decrease); since 1973 (spatial pattern of trends)"
  statement:
    simple: "Across the world's land, the air has got less damp since 2000. A few places got damper."
    simple_es: "En las tierras del mundo, el aire está menos húmedo desde 2000. Algunos lugares se volvieron más húmedos."
    scientific: "Very likely decrease in surface relative humidity over much of global land since 2000, particularly Northern Hemisphere mid-latitudes, with increases at northern high latitudes. Since 1973 relative-humidity trends are generally increasing over higher latitudes and the tropics and generally decreasing over the sub-tropics and mid-latitudes, particularly over land. Not assessed region by region in AR6; the pattern is a hint, not a regional finding."
    scientific_es: "Disminución muy probable de la humedad relativa en superficie en gran parte de la tierra del mundo desde 2000, sobre todo en latitudes medias del hemisferio norte, con aumentos en latitudes altas del norte. Desde 1973 las tendencias de humedad relativa suelen aumentar en latitudes altas y en los trópicos y suelen disminuir en los subtrópicos y latitudes medias, sobre todo en tierra. No se evalúa región por región en AR6; el patrón es una pista, no un hallazgo regional."
  source: "Gulev, S.K. et al., 2021: Chapter 2, Changing State of the Climate System, in IPCC, 2021: Climate Change 2021: The Physical Science Basis. Contribution of Working Group I to the Sixth Assessment Report [Masson-Delmotte, V. et al. (eds.)]. Cambridge University Press, doi:10.1017/9781009157896.004, pp. 287-422, Section 2.3.1.3.2 (Surface humidity), p. 330 (text and summary paragraph), Figure 2.13c. Final chapter PDF: https://www.ipcc.ch/report/ar6/wg1/downloads/report/IPCC_AR6_WGI_Chapter02.pdf"
