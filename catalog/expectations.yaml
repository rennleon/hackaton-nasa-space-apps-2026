- ar6_region: "CNA"
  ar6_region_name: "C.North-America"
  place: "Wisconsin: the part west of about 90 W (about half of the state box)"
  variable_kind: temperature
  metric: mean_annual
  direction: up
  confidence: "Very likely mean warming across North America (Chapter 12 summary of Atlas.9.2)"
  confidence_es: "Calentamiento medio muy probable en toda Norteamérica (resumen del Capítulo 12 de Atlas.9.2)"
  period: "1961-2015"
  statement:
    simple: "The air in this part of the US has been getting warmer. Scientists are quite sure."
    simple_es: "El aire en esta parte de EE. UU. se ha vuelto más cálido. Los científicos están bastante seguros."
    scientific: "Annual mean surface temperature shows significant positive trends across North America in 1961-2015 and a temperature change signal has emerged in all North American regions (Berkeley Earth, aggregated over reference regions). Chapter 12 states that observed mean warming across North America is very likely. The sentence is annual; warming by season in Wisconsin is not assessed here (the NOAA state summary in regions.yaml says summers warmed little)."
    scientific_es: "La temperatura media anual en superficie muestra tendencias positivas significativas en toda Norteamérica en 1961-2015 y ha emergido una señal de cambio de temperatura en todas las regiones de Norteamérica (Berkeley Earth, agregado por regiones de referencia). El Capítulo 12 afirma que el calentamiento medio observado en Norteamérica es muy probable. La frase es anual; el calentamiento por estación en Wisconsin no se evalúa aquí (el resumen estatal de NOAA en regions.yaml dice que los veranos se calentaron poco)."
  source: "Gutierrez, J.M. et al., 2021: Atlas, in IPCC, 2021: Climate Change 2021: The Physical Science Basis. Contribution of Working Group I to the Sixth Assessment Report [Masson-Delmotte, V. et al. (eds.)]. Cambridge University Press, doi:10.1017/9781009157896.021, pp. 1927-2058, Section Atlas.9.2 (North America, Assessment and Synthesis of Observations, Trends, and Attribution), p. 2004, 1st paragraph; CH12: Ranasinghe, R. et al., 2021: Chapter 12, Climate Change Information for Regional Impact and for Risk Assessment, in IPCC, 2021: Climate Change 2021: The Physical Science Basis. Contribution of Working Group I to the Sixth Assessment Report [Masson-Delmotte, V. et al. (eds.)]. Cambridge University Press, doi:10.1017/9781009157896.014, pp. 1767-1926, Section 12.4.6, p. 1828 (Mean air temperature). Final chapter PDF: https://www.ipcc.ch/report/ar6/wg1/downloads/report/IPCC_AR6_WGI_Atlas.pdf ; Final chapter PDF: https://www.ipcc.ch/report/ar6/wg1/downloads/report/IPCC_AR6_WGI_Chapter12.pdf"
  checked_by: "agent (sources-research), needs human confirmation"
  opened_at: "2026-11-15"

- ar6_region: "CNA"
  ar6_region_name: "C.North-America"
  place: "Wisconsin: the part west of about 90 W (about half of the state box)"
  variable_kind: temperature
  metric: hot_extremes
  direction: unclear
  confidence: "Low confidence (observed trends: weak and inconsistent; detection and attribution: low confidence)"
  confidence_es: "Confianza baja (tendencias observadas: débiles e inconsistentes; detección y atribución: confianza baja)"
  period: "since about 1950 (Table 11.1 header; the regional table row gives no separate period)"
  statement:
    simple: "Very hot days have not clearly become more common here. Scientists are not sure why."
    simple_es: "Los días muy calurosos no son claramente más comunes aquí. Los científicos no están seguros del motivo."
    scientific: "Observed trends in hot and cold extremes in CNA are weak and inconsistent (Dunn et al. 2020); the assessed row is low confidence, and evidence of a human contribution applies to some events only. Chapter 12 repeats that extreme temperatures increased in North America in recent decades except in Central and Eastern North America (low confidence). Region of Wisconsin: the box straddles CNA and ENA, both assessed low confidence."
