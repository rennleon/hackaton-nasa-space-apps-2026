    simple_es: "Los periodos secos aumentaron en partes del sur de Asia. Los científicos lo creen."
    scientific: "Observed trends: medium confidence of an increase in meteorological drought, with subregional differences but drying dominant (see also Section 10.6.3). Human contribution: low confidence, limited evidence. Direction here is for rainfall: more drought means rain shortfalls have become more common."
    scientific_es: "Tendencias observadas: confianza media en un aumento de la sequía meteorológica, con diferencias subregionales pero con predominio de la sequedad (véase también la Sección 10.6.3). Contribución humana: confianza baja, evidencia limitada. La dirección aquí es para la lluvia: más sequía significa que los déficits de lluvia se han vuelto más comunes."
  source: "Seneviratne, S.I. et al., 2021: Chapter 11, Weather and Climate Extreme Events in a Changing Climate, in IPCC, 2021: Climate Change 2021: The Physical Science Basis. Contribution of Working Group I to the Sixth Assessment Report [Masson-Delmotte, V. et al. (eds.)]. Cambridge University Press, doi:10.1017/9781009157896.013, pp. 1513-1766, Table 11.9 (Asia, drought), p. 1653, row South Asia (SAS), MET. Final chapter PDF: https://www.ipcc.ch/report/ar6/wg1/downloads/report/IPCC_AR6_WGI_ch11.pdf"
