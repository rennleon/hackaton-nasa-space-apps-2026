# Region cards. Every region follows the four region rules (MVP spec):
#   1. one climate regime  2. >= 4 cells of the coarsest dataset
#   3. grid-aligned edges  4. a comparison box for the spatial robustness check
#
# geometry.kind:
#   bbox  -> bbox is the exact request sent to Giovanni (W, S, E, N)
#   shape -> a Giovanni shape; bbox is its approximate bounding box and
#            area_fraction = shape area / bbox area (used to estimate grid cells)
# Raw data for a region lives in data/raw/<id>/.
# listed: false hides a region from the region picker (e.g. a comparison box).
# expectations: stage-1 check (b) -- a CITED published reason to expect change here:
#   { variable, direction: up|down|either, expected_per_decade: float|null, reason: {simple, scientific}, source: "citation or URL" }
#   Leave empty rather than invent one; the app then shows "no published expectation recorded".

- id: cajamarca_highlands
  name:
    simple: Cajamarca highlands
    scientific: Northern Peruvian Andes (Cajamarca highlands)
  description:
    simple: The mountains around Cajamarca city in northern Peru, high above the sea.
    scientific: Grid-aligned box over the northern Peruvian Andes; excludes the coastal desert column west of 79°W.
  regime: Andean highland
  geometry:
    kind: bbox
    bbox: [-79.0, -8.0, -77.0, -5.0]
  comparison_region: cajamarca_west
  expectations: []
  declared_seasons:
    - { variable: airs_rh_surf_day, id: wet, name: { simple: rainy season, scientific: Jan–Apr }, months: [1, 2, 3, 4] }
    - { variable: airs_rh_surf_day, id: dry, name: { simple: dry season, scientific: Jun–Aug }, months: [6, 7, 8] }
    - { variable: airs_rh_surf_night, id: wet, name: { simple: rainy season, scientific: Jan–Apr }, months: [1, 2, 3, 4] }
    - { variable: airs_rh_surf_night, id: dry, name: { simple: dry season, scientific: Jun–Aug }, months: [6, 7, 8] }
    - { variable: gpm_precip, id: wet, name: { simple: rainy season, scientific: Jan–Apr }, months: [1, 2, 3, 4] }
    - { variable: merra2_oc, id: dry, name: { simple: dry season, scientific: Jun–Aug }, months: [6, 7, 8] }
    - { variable: mopitt_co, id: dry, name: { simple: dry season, scientific: Jun–Aug }, months: [6, 7, 8] }

- id: cajamarca_west
  name:
    simple: Cajamarca (test box)
    scientific: Cajamarca department box, first download (mixed coast and Andes)
  description:
    simple: Our first test box. It mixes the dry coast with the mountains, so we use it only to double-check results.
    scientific: Requested as 79.5–77.7°W, 7.8–4.5°S; on a 1° grid it returns 80–78°W, 8–4°S, mixing coastal desert and western Andean slope. Used as the spatial comparison box.
  regime: mixed coastal desert and Andean slope
  listed: false  # comparison box only; not offered in the region list
  geometry:
    kind: bbox
    bbox: [-79.5, -7.8, -77.7, -4.5]
  comparison_region: cajamarca_highlands
  expectations: []
  declared_seasons:
    - { variable: airs_rh_surf_day, id: wet, name: { simple: rainy season, scientific: Jan–Apr }, months: [1, 2, 3, 4] }
    - { variable: airs_rh_surf_day, id: dry, name: { simple: dry season, scientific: Jun–Aug }, months: [6, 7, 8] }
    - { variable: airs_rh_surf_night, id: wet, name: { simple: rainy season, scientific: Jan–Apr }, months: [1, 2, 3, 4] }
    - { variable: airs_rh_surf_night, id: dry, name: { simple: dry season, scientific: Jun–Aug }, months: [6, 7, 8] }

- id: wisconsin
  name:
    simple: Wisconsin
    scientific: Wisconsin, USA (state shape)
  description:
    simple: A US state with farms, forests and lakes, where smoke from Canadian wildfires sometimes arrives in summer.
    scientific: Giovanni US-state shape; the organizers' example region (MODIS-Aqua AOD and wildfire smoke).
  regime: temperate continental
  geometry:
    kind: shape
    shape_ref: null  # TODO: confirm the Giovanni shape id for Wisconsin (tl_2014_us_state/shp_??)
    bbox: [-92.9, 42.5, -86.8, 47.1]
    area_fraction: 0.7
  comparison_region: null
  expectations: []
  declared_seasons:
    - { variable: modis_aqua_aod, id: summer, name: { simple: summer, scientific: Jun–Aug }, months: [6, 7, 8] }
    - { variable: modis_terra_aod, id: summer, name: { simple: summer, scientific: Jun–Aug }, months: [6, 7, 8] }
    - { variable: merra2_oc, id: summer, name: { simple: summer, scientific: Jun–Aug }, months: [6, 7, 8] }
    - { variable: gpm_precip, id: summer, name: { simple: summer, scientific: Jun–Aug }, months: [6, 7, 8] }
