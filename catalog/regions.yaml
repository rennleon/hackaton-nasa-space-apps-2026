# Region cards. Every region follows the four region rules (MVP spec):
#   1. one climate regime  2. >= 4 cells of the coarsest dataset  3. grid-aligned edges
#   (rule 4, a neighbouring comparison box, is parked: see CLAUDE.md parking lot)
#
# geometry.kind:
#   bbox  -> bbox is the exact request sent to Giovanni (W, S, E, N)
#   shape -> a Giovanni shape; bbox is its approximate bounding box and
#            area_fraction = shape area / bbox area (used to estimate grid cells)
# Raw data for a region lives in data/raw/<id>/.
# listed: false hides a region from the region picker (e.g. a comparison box).
# expectations: stage-1 check (b) -- a CITED published reason to expect change here:
#   { variable, direction: up|down|either, expected_per_decade: float|null, reason: {simple, scientific}, source: "citation or URL" }
#   Leave empty rather than invent one; the app then shows "no published expectation recorded".

- id: cajamarca_highlands
  name:
    simple: Cajamarca highlands
    scientific: Northern Peruvian Andes (Cajamarca highlands)
    simple_es: "Cajamarca (zona alta)"
    scientific_es: "Andes del norte del Perú (zona alta de Cajamarca)"
  description:
    simple: The mountains around Cajamarca city in northern Peru, high above the sea.
    scientific: Grid-aligned box over the northern Peruvian Andes; excludes the coastal desert column west of 79°W.
    simple_es: "Las montañas alrededor de la ciudad de Cajamarca, en el norte del Perú, muy por encima del nivel del mar."
    scientific_es: "Caja alineada con la rejilla sobre los Andes del norte del Perú; excluye la columna de desierto costero al oeste de 79°O."
  regime: Andean highland
  geometry:
    kind: bbox
    bbox: [-79.0, -8.0, -77.0, -5.0]
  comparison_region: null  # neighbour-box check parked (shares 3 of 6 cells with cajamarca_west)
  expectations:
    - variable: merra2_t2m
      direction: up
      expected_per_decade: null
      reason:
        simple: "Air in the Andes mountains has been getting warmer for many years."
        scientific: "Mean annual temperature in the tropical Andes rose by 0.10-0.11 °C per decade over 1939-1998 and faster (0.32-0.34 °C per decade) over the last 25 years of that series; significant at 95% even at the highest elevations. This is a surface-station record for 1939-1998, so it motivates the sign, not the 2002+ rate."
        simple_es: "El aire de los Andes se ha ido calentando por muchos años."
        scientific_es: "La temperatura media anual en los Andes tropicales aumentó 0.10–0.11 °C por década en 1939–1998 y más rápido (0.32–0.34 °C por década) en los últimos 25 años de esa serie; significativo al 95 % incluso a las mayores elevaciones. Es un registro de estaciones de superficie de 1939–1998, así que motiva el signo, no la tasa de 2002 en adelante."
      source: "Vuille, M. and Bradley, R. S., Mean annual temperature trends and their vertical structure in the tropical Andes, Geophysical Research Letters 27(23), 2000. https://doi.org/10.1029/2000GL011871"
