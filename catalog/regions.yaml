- id: wisconsin
  name:
    simple: Wisconsin
    scientific: Wisconsin area, USA (box around the state)
    simple_es: "Wisconsin"
    scientific_es: "Zona de Wisconsin, EE. UU. (rectángulo alrededor del estado)"
  description:
    simple: A US state with farms, forests and lakes. We look at a box around the state.
    scientific: "Bounding box of the Wisconsin state shape (W -92.9, S 42.5, E -86.8, N 47.1). Live Giovanni and NASA POWER series are averaged over the whole box (cos-latitude weighted grid cells), not masked to the state outline, so edges of neighbouring states and part of Lake Michigan are included (land-only products such as GLDAS skip water cells)."
    simple_es: "Un estado de EE. UU. con granjas, bosques y lagos. Miramos un rectángulo alrededor del estado."
    scientific_es: "Rectángulo que contiene la forma del estado de Wisconsin (O -92.9, S 42.5, E -86.8, N 47.1). Las series en vivo de Giovanni y NASA POWER se promedian sobre todo el rectángulo (celdas ponderadas por coseno de la latitud), sin recortar al contorno del estado; incluye bordes de estados vecinos y parte del lago Michigan (los productos solo de tierra, como GLDAS, omiten las celdas de agua)."
  regime: temperate continental
  geometry:
    kind: shape
    shape_ref: null  # TODO: confirm the Giovanni shape id for Wisconsin (tl_2014_us_state/shp_??)
    bbox: [-92.9, 42.5, -86.8, 47.1]
    area_fraction: 0.7
  comparison_region: null
  expectations:
    - variable: merra2_sulfate
      direction: down
      expected_per_decade: null
      reason:
        simple: "The US puts out much less of this pollution than before."
        scientific: "US SO2 emissions declined by over 70% between 1995 and 2013, coinciding with observed AOD reductions of 3.0 ± 0.6% per year over the eastern US (the study period ends in 2013; the decline in emissions is national, so it motivates the sign here)."
        simple_es: "EE. UU. echa mucha menos de esta contaminación que antes."
        scientific_es: "Las emisiones de SO₂ de EE. UU. bajaron más de 70 % entre 1995 y 2013, a la par de reducciones observadas de AOD de 3.0 ± 0.6 % por año en el este de EE. UU. (el estudio termina en 2013; la baja de emisiones es nacional, así que motiva el signo aquí)."
      source: "NOAA Chemical Sciences Laboratory news item (2016) on Keppel-Aleks and Washenfelder, The effect of atmospheric sulfate reductions on diffuse radiation and photosynthesis in the United States during 1995-2013, Geophysical Research Letters, doi:10.1002/2016GL070052. https://csl.noaa.gov/news/2016/196_1021.html"
    - variable: merra2_t2m
      direction: up
      expected_per_decade: null
