- id: wisconsin
  name:
    simple: Wisconsin
    scientific: Wisconsin, USA (state shape)
  description:
    simple: A US state with farms, forests and lakes, where smoke from Canadian wildfires sometimes arrives in summer.
    scientific: Giovanni US-state shape; the organizers' example region (MODIS-Aqua AOD and wildfire smoke).
  regime: temperate continental
  geometry:
    kind: shape
    shape_ref: null  # TODO: confirm the Giovanni shape id for Wisconsin (tl_2014_us_state/shp_??)
    bbox: [-92.9, 42.5, -86.8, 47.1]
    area_fraction: 0.7
  comparison_region: null
  expectations:
    - variable: merra2_sulfate
      direction: down
      expected_per_decade: null
      reason:
        simple: "Factories and power plants put out much less of this pollution than before."
        scientific: "US SO2 emissions declined by over 70% between 1995 and 2013, coinciding with observed AOD reductions of 3.0 ± 0.6% per year over the eastern US (the study period ends in 2013; the decline in emissions is national, so it motivates the sign here)."
      source: "NOAA Chemical Sciences Laboratory news item (2016) on Keppel-Aleks and Washenfelder, The effect of atmospheric sulfate reductions on diffuse radiation and photosynthesis in the United States during 1995-2013, Geophysical Research Letters, doi:10.1002/2016GL070052. https://csl.noaa.gov/news/2016/196_1021.html"
    - variable: merra2_t2m
      direction: up
      expected_per_decade: null
      reason:
        simple: "Over the last hundred years, the air in Wisconsin has become warmer."
        scientific: "Annual average temperatures in Wisconsin have increased almost 2.5 °F since the beginning of the 20th century. The report notes summers have not warmed substantially; the warming is concentrated in winter and spring."
      source: "NOAA NCEI and CICS-NC, State Climate Summaries 2025: Wisconsin (NOAA Technical Report NESDIS 150-WI). https://statesummaries.ncics.org/chapter/wi/"
    - variable: gpm_precip
      direction: up
      expected_per_decade: null
      reason:
        simple: "Wisconsin has been getting more rain and snow in recent years."
        scientific: "Wisconsin has experienced increases in both annual precipitation and extreme precipitation events in recent decades (annual totals, not summer-specific)."
      source: "NOAA NCEI and CICS-NC, State Climate Summaries 2025: Wisconsin (NOAA Technical Report NESDIS 150-WI). https://statesummaries.ncics.org/chapter/wi/"
    - variable: power_t2m
      direction: up
      expected_per_decade: null
      reason:
        simple: "Over the last hundred years, the air in Wisconsin has become warmer."
        scientific: "Annual average temperatures in Wisconsin have increased almost 2.5 °F since the beginning of the 20th century. The report notes summers have not warmed substantially; the warming is concentrated in winter and spring."
      source: "NOAA NCEI and CICS-NC, State Climate Summaries 2025: Wisconsin (NOAA Technical Report NESDIS 150-WI). https://statesummaries.ncics.org/chapter/wi/"
    - variable: power_precip
      direction: up
      expected_per_decade: null
      reason:
        simple: "Wisconsin has been getting more rain and snow in recent years."
        scientific: "Wisconsin has experienced increases in both annual precipitation and extreme precipitation events in recent decades (annual totals, not summer-specific)."
      source: "NOAA NCEI and CICS-NC, State Climate Summaries 2025: Wisconsin (NOAA Technical Report NESDIS 150-WI). https://statesummaries.ncics.org/chapter/wi/"
  declared_seasons:
    - { variable: modis_aqua_aod, id: summer, name: { simple: summer, scientific: Jun–Aug }, months: [6, 7, 8] }
    - { variable: modis_terra_aod, id: summer, name: { simple: summer, scientific: Jun–Aug }, months: [6, 7, 8] }
    - { variable: merra2_oc, id: summer, name: { simple: summer, scientific: Jun–Aug }, months: [6, 7, 8] }
    - { variable: gpm_precip, id: summer, name: { simple: summer, scientific: Jun–Aug }, months: [6, 7, 8] }
