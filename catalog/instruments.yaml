# Instrument cards: the satellite instruments and computer models our variables come from.
# A variable card points here with source.instrument_id. NASA POWER is a delivery service,
# not an instrument: its variables point at merra2 and carry source.delivered_by: NASA POWER.
# live: giovanni (Giovanni cloud API) | power (NASA POWER API) | offline (only a manual export)

- id: airs
  name: { simple: AIRS, scientific: "AIRS (Atmospheric Infrared Sounder)", simple_es: "AIRS", scientific_es: "AIRS (Atmospheric Infrared Sounder, sondeador atmosférico de infrarrojos)" }
  kind: satellite
  platform: Aqua
  since: 2002
  measures:
    simple: How warm and damp the air is near the ground, day and night.
    scientific: Surface air temperature, surface relative humidity and many profile fields, twice daily (≈13:30 and ≈01:30 local overpass), Level-3 monthly 1° grid.
    simple_es: "Qué tan cálido y húmedo está el aire cerca del suelo, día y noche."
    scientific_es: "Temperatura del aire en superficie, humedad relativa en superficie y muchos campos de perfil, dos veces al día (pasadas de ≈13:30 y ≈01:30 hora local), rejilla mensual de nivel 3 a 1°."
  how:
    simple: It reads the heat glow of the air from space, twice a day. The satellite now passes over a bit later each year.
    scientific: "Hyperspectral infrared sounder (2378 channels). Aqua is in free drift, so its local crossing time is slowly moving later (NASA Aqua mission page, https://science.nasa.gov/mission/aqua/); the nominal crossing is 13:30 ascending and 01:30 descending (AIRS V7 Level 3 Product User Guide, Section 1.5)."
    simple_es: "Lee el brillo de calor del aire desde el espacio, dos veces al día. Ahora el satélite pasa un poco más tarde cada año."
    scientific_es: "Sondeador hiperespectral de infrarrojos (2378 canales). Aqua está en deriva libre, así que su hora local de cruce se va retrasando poco a poco (página de la misión Aqua de la NASA, https://science.nasa.gov/mission/aqua/); el cruce nominal es a las 13:30 en ascenso y a las 01:30 en descenso (AIRS V7 Level 3 Product User Guide, Sección 1.5)."
  live: giovanni
  link: https://airs.jpl.nasa.gov/

- id: gpm_imerg
  name: { simple: GPM rain satellites, scientific: "GPM IMERG (Integrated Multi-satellitE Retrievals for GPM)", simple_es: "Satélites de lluvia GPM", scientific_es: "GPM IMERG (Integrated Multi-satellitE Retrievals for GPM, recuperaciones integradas multisatélite)" }
  kind: satellite
  platform: GPM Core Observatory and partner satellites
  since: 2000
  measures:
    simple: How much rain and snow falls.
    scientific: "Merged multi-satellite precipitation, gauge-adjusted (Final Run), monthly 0.1° grid. TRMM era (1998-2015) and GPM era (2014 on) in one record. The V07 record starts in Jan 1998, but Jan 1998 to May 2000 is lower quality, so we use it from June 2000."
    simple_es: "Cuánta lluvia y nieve cae."
    scientific_es: "Precipitación multisatélite combinada, ajustada con pluviómetros (corrida final), rejilla mensual de 0.1°. Era TRMM (1998-2015) y era GPM (desde 2014) en un solo registro. El registro V07 empieza en enero de 1998, pero de enero de 1998 a mayo de 2000 es de menor calidad, así que lo usamos desde junio de 2000."
  how:
    simple: Many satellites watch clouds and rain, and rain gauges on the ground check them.
    scientific: "Passive-microwave estimates intercalibrated to the combined radar-radiometer (CORRA) of the TRMM and GPM core satellites; infrared estimates calibrated to the microwave ones; Final Run bias-adjusted with GPCC gauges."
    simple_es: "Muchos satélites vigilan las nubes y la lluvia. Pluviómetros en el suelo los revisan."
    scientific_es: "Estimaciones de microondas pasivas intercalibradas con el radar-radiómetro combinado (CORRA) de los satélites núcleo de TRMM y GPM; estimaciones infrarrojas calibradas con las de microondas; corrida final ajustada con pluviómetros de GPCC."
  live: giovanni
  link: https://gpm.nasa.gov/data/imerg

- id: omi
  name: { simple: OMI, scientific: "OMI (Ozone Monitoring Instrument)", simple_es: "OMI", scientific_es: "OMI (Ozone Monitoring Instrument, instrumento de monitoreo de ozono)" }
  kind: satellite
  platform: Aura
  since: 2004
  measures:
    simple: How hazy the air is, and how much of some polluting gases it holds.
    scientific: Aerosol optical depth (OMAERUV), tropospheric NO₂ (OMNO2d), SO₂, ozone; daily Level-3 grids (OMNO2d 0.25°, OMAERUVd 1°).
    simple_es: "Qué tan brumoso está el aire y cuánto hay de algunos gases contaminantes."
    scientific_es: "Profundidad óptica de aerosoles (OMAERUV), NO₂ troposférico (OMNO2d), SO₂, ozono; rejillas diarias de nivel 3 (OMNO2d 0.25°, OMAERUVd 1°)."
  how:
    simple: It watches sunlight bounce back from the air and sees what the air holds. It passes over at about 1:45 in the afternoon. Since 2007, part of its view has been blocked.
    scientific: "UV-visible imaging spectrometer measuring backscattered solar radiance. Local equator crossing 13:45 (ascending); science data from 1 Oct 2004 (OMNO2 README, Section 2.1). Since 25 June 2007 the row anomaly blocks part of the view, now about half of the 60 positions (Torres et al. 2018, doi:10.5194/amt-11-2701-2018)."
    simple_es: "Mira la luz del sol que rebota en el aire y ve qué contiene. Pasa a eso de la 1:45 de la tarde. Desde 2007, una parte de su vista está tapada."
    scientific_es: "Espectrómetro de imágenes ultravioleta-visible que mide la radiancia solar retrodispersada. Cruce local del ecuador a las 13:45 (ascendente); datos científicos desde el 1 de octubre de 2004 (README de OMNO2, Sección 2.1). Desde el 25 de junio de 2007 la anomalía de filas tapa parte de la vista, hoy cerca de la mitad de las 60 posiciones (Torres et al. 2018, doi:10.5194/amt-11-2701-2018)."
  live: giovanni
  # aura.gsfc.nasa.gov/omi.html redirects to a page that does not mention OMI; the OMNO2 README was opened (sources-checked.md 4)
  link: https://acdisc.gesdisc.eosdis.nasa.gov/data/Aura_OMI_Level3/OMNO2d.003/doc/README.OMNO2.pdf

- id: merra2
  name: { simple: MERRA-2 computer model, scientific: "MERRA-2 (Modern-Era Retrospective analysis for Research and Applications, Version 2)", simple_es: "Modelo de computadora MERRA-2", scientific_es: "MERRA-2 (Modern-Era Retrospective analysis for Research and Applications, versión 2)" }
  kind: model
  since: 1980
  measures:
    simple: Past weather everywhere on Earth, like temperature, rain, damp air and haze.
    scientific: Global atmospheric reanalysis (0.5° × 0.625°), assimilating satellite, station, balloon and aircraft observations, incl. aerosol optical depth.
    simple_es: "El tiempo del pasado en toda la Tierra. Por ejemplo temperatura, lluvia, humedad y bruma."
    scientific_es: "Reanálisis atmosférico global (0.5° × 0.625°) que asimila observaciones de satélite, estaciones, globos y aviones, incluida la profundidad óptica de aerosoles."
  how:
    simple: A computer rebuilds past weather from millions of real measurements.
    scientific: "GEOS-5.12.4 model with GSI 3D-Var assimilation; the observations it assimilates change over time, which can cause discontinuities in the gridded fields (Gelaro et al. 2017, doi:10.1175/JCLI-D-16-0758.1; McCarty et al. 2016, NASA/TM-2016-104606 Vol. 46). AIRS and AMSU-A radiances from Aqua are assimilated from 1 Sep 2002, so MERRA-2 (and NASA POWER) is not fully independent of AIRS."
    simple_es: "Una computadora reconstruye el tiempo del pasado con millones de mediciones reales."
    scientific_es: "Modelo GEOS-5.12.4 con asimilación 3D-Var de GSI; las observaciones que asimila cambian con el tiempo, lo que puede causar discontinuidades en los campos en rejilla (Gelaro et al. 2017, doi:10.1175/JCLI-D-16-0758.1; McCarty et al. 2016, NASA/TM-2016-104606 Vol. 46). Las radiancias de AIRS y AMSU-A de Aqua se asimilan desde el 1 de septiembre de 2002, así que MERRA-2 (y NASA POWER) no es del todo independiente de AIRS."
  live: power
  assimilates: [airs]  # AIRS radiances enter MERRA-2 from 2002-09 (Gelaro et al. 2017, Table 1)
  link: https://gmao.gsfc.nasa.gov/reanalysis/MERRA-2/

- id: ceres_syn1deg
  name: { simple: CERES SYN1deg (NASA data product), scientific: "CERES SYN1deg (Clouds and the Earth's Radiant Energy System, synoptic 1° product)", simple_es: "CERES SYN1deg (producto de datos de la NASA)", scientific_es: "CERES SYN1deg (Clouds and the Earth's Radiant Energy System, producto sinóptico de 1°)" }
  kind: model
  since: 2001
  measures:
    simple: How hazy the air is, for any place on Earth.
    scientific: Aerosol optical depth at 550 nm on a 1° × 1° grid, as delivered by NASA POWER (parameter AOD_55; the POWER response header names SYN1DEG as the source). Valid POWER months start in 2001-01.
    simple_es: "Qué tan brumoso está el aire, en cualquier lugar de la Tierra."
    scientific_es: "Profundidad óptica de aerosoles a 550 nm en una rejilla de 1° × 1°, entregada por NASA POWER (parámetro AOD_55; la cabecera de la respuesta de POWER indica SYN1DEG como fuente). Los meses válidos de POWER empiezan en 2001-01."
  how:
    simple: A NASA data product from the CERES project. We treat it as a computer estimate, not a direct reading.
    scientific: A gridded CERES data product from NASA Langley; we label it a computer estimate because it is not a direct single-sensor retrieval.
    simple_es: "Un producto de datos de la NASA del proyecto CERES. Lo tratamos como una estimación de computadora, no como una lectura directa."
    scientific_es: "Un producto de datos en rejilla de CERES del NASA Langley; lo llamamos estimación de computadora porque no es una medición directa de un solo sensor."
  live: power
  link: https://ceres.larc.nasa.gov/data/

- id: gldas
  name: { simple: GLDAS land computer model, scientific: "GLDAS (Global Land Data Assimilation System)", simple_es: "Modelo de computadora de la tierra GLDAS", scientific_es: "GLDAS (Global Land Data Assimilation System, sistema global de asimilación de datos de superficie terrestre)" }
  kind: model
  since: 2000
  measures:
    simple: How wet the ground is, how much water returns to the air, and snow.
    scientific: "GLDAS 2.1 (Noah 3.6 land-surface model), monthly 0.25° grid; soil moisture, evapotranspiration, snow water equivalent, runoff. Land only. Forcing is a mix of model analyses and observation-based data (GDAS, GPCP precipitation, AGRMET radiation), so it is not homogeneous."
    simple_es: "Qué tan mojado está el suelo, cuánta agua vuelve al aire y la nieve."
    scientific_es: "GLDAS 2.1 (modelo de superficie terrestre Noah 3.6), rejilla mensual de 0.25°; humedad del suelo, evapotranspiración, equivalente en agua de la nieve, escorrentía. Solo tierra. El forzamiento mezcla análisis de modelos y datos basados en observaciones (GDAS, precipitación GPCP, radiación AGRMET), así que no es homogéneo."
  how:
    simple: A computer works out how wet the ground is from rain, sun and weather.
    scientific: Offline land-surface model forced by observation-based meteorology and precipitation.
    simple_es: "Una computadora calcula qué tan mojado está el suelo usando lluvia, sol y tiempo."
    scientific_es: "Modelo de superficie terrestre sin acoplar, forzado con meteorología y precipitación basadas en observaciones."
  live: giovanni
  link: https://ldas.gsfc.nasa.gov/gldas

- id: modis
  name: { simple: MODIS, scientific: "MODIS (Moderate Resolution Imaging Spectroradiometer)", simple_es: "MODIS", scientific_es: "MODIS (Moderate Resolution Imaging Spectroradiometer, espectrorradiómetro de imágenes de resolución moderada)" }
  kind: satellite
  platform: Terra and Aqua
  since: 2000
  measures:
    simple: How hazy the air is.
    scientific: Aerosol optical depth at 550 nm (Dark Target / Deep Blue combined), Level-3 monthly 1° grid.
    simple_es: "Qué tan brumoso está el aire."
    scientific_es: "Profundidad óptica de aerosoles a 550 nm (Dark Target / Deep Blue combinados), rejilla mensual de nivel 3 a 1°."
  how:
    simple: A camera in space sees how much the haze dims the ground below.
    scientific: 36-band imaging radiometer; aerosol retrieval over dark and bright surfaces.
    simple_es: "Una cámara en el espacio ve cuánto la bruma oscurece el suelo de abajo."
    scientific_es: "Radiómetro de imágenes de 36 bandas; recuperación de aerosoles sobre superficies oscuras y brillantes."
  live: offline
  link: https://modis.gsfc.nasa.gov/

- id: mopitt
  name: { simple: MOPITT, scientific: "MOPITT (Measurements Of Pollution In The Troposphere)", simple_es: "MOPITT", scientific_es: "MOPITT (Measurements Of Pollution In The Troposphere, mediciones de contaminación en la troposfera)" }
  kind: satellite
  platform: Terra
  since: 2000
  measures:
    simple: How much carbon monoxide, a smoky gas, the air holds.
    scientific: Total-column carbon monoxide, Level-3 monthly 1° grid.
    simple_es: "Cuánto monóxido de carbono, un gas del humo, tiene el aire."
    scientific_es: "Columna total de monóxido de carbono, rejilla mensual de nivel 3 a 1°."
  how:
    simple: It looks at heat and sunlight from below and spots the smoky gas.
    scientific: Gas-correlation radiometer in thermal and near infrared.
    simple_es: "Mira el calor y la luz del sol desde abajo. Así detecta el gas del humo."
    scientific_es: "Radiómetro de correlación de gas en el infrarrojo térmico y cercano."
  live: offline
  link: https://www2.acom.ucar.edu/mopitt
