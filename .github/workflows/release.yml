name: Release

# Runs when a version tag is pushed (see RELEASING.md). Produces everything needed to roll back
# to this version later: a GitHub Release, the built web app, and a versioned API image.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TD_POWER_OFFLINE: "1"
      TD_GIOVANNI_OFFLINE: "1" # never call Giovanni from CI; the committed cache serves pre-loaded data
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches VERSION
        run: |
          test "v$(cat VERSION)" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != VERSION $(cat VERSION)"; exit 1; }
          node scripts/version.mjs check
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No tests here: the release commit already passed CI on its pull request.
      - name: Web build
        working-directory: web
        run: npm ci && VITE_API_URL=/api npm run build
      - name: Package web build
        run: tar -czf "web-dist-${GITHUB_REF_NAME}.tar.gz" -C web/dist .
      - name: Release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\["v"\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release ${GITHUB_REF_NAME}" > notes.md
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: web-dist-${{ github.ref_name }}.tar.gz
